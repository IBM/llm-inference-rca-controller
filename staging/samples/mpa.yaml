---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-deployment
  namespace: llm-d-sim
  annotations:
    llm-d.ai/managed: 'true'
    llm-d.ai/model-id: test-model  # must match --model arg and VPA's model-id
    llm-d.ai/variant-cost: '10.0'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: External
    external:
      metric:
        name: wva_desired_replicas
        selector:
          matchLabels:
            variant_name: sample-deployment
            exported_namespace: llm-d-sim
      target:
        type: AverageValue
        averageValue: "1"
  # TESTING ONLY — aggressive HPA scaling for quick validation.
  behavior:
    scaleUp:
      # TESTING ONLY: react immediately to increased load.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # TESTING ONLY: scale down immediately when load drops.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  annotations:
    llm-d.ai/managed: 'true'
    llm-d.ai/model-id: test-model
    llm-d.ai/variant-cost: '10.0'
  name: sample-deployment
  namespace: llm-d-sim
  labels:
    app.kubernetes.io/instance: llm-d-sim-demo
    scaler: workload-variant-autoscaler
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-deployment
  recommenders:
    - name: prometheus
  resourcePolicy:
    resourceClaimPolicies:
      - claimTemplateName: gpu-claim
        deviceClassName: gpu.example.com
        controlledCapacities: [compute, memory]
        minAllowed:
          compute: '10'
          memory: 1Gi
        maxAllowed:
          compute: '50'
          memory: 40Gi
  updatePolicy:
    updateMode: DRARecreate
    minReplicas: 1
